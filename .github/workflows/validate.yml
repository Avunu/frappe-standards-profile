name: validate

# Every change to this profile, and the frappe-nix it runs against (spec §1.3 item P, §6.4):
#
#   validate  the frappe-nix flake.lock pins: workflow and Nix lint, then scripts/check.sh
#             (profile validate, the resolved configuration of frappe-nix's fixture app
#             against resolved.snapshot.json, an offline sync of that app, fleet.json).
#             The `validate` check the main ruleset requires (repo-policy/rulesets/main.json).
#   latest    the same checks against the newest frappe-nix release (any major the
#             profile's requires-frappe-nix range allows), so a release that
#             would change any of our values fails here before `frappe-nix repo rollout`
#             takes it to the apps. Options that release adds, which the snapshot of the
#             pinned frappe-nix can't have, are notices, not failures, unless one is a
#             module that resolves on (check.sh --additive).
#             Skipped, with a notice, while no release falls in that range.
#
# The weekly schedule runs `latest` against new frappe-nix releases between our own changes.
# release.yml dispatches this workflow on its release PR, which GITHUB_TOKEN opened.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      - name: Lint workflows, Nix and scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nix develop -c actionlint
          nix develop -c zizmor .github/workflows .github/dependabot.yml
          nix develop -c nixfmt --check flake.nix
          nix develop -c shellcheck scripts/*.sh
          nix develop -c ruff check --no-cache scripts
          nix develop -c ruff format --no-cache --check scripts

      - name: Check the profile against the pinned frappe-nix
        run: scripts/check.sh

  latest:
    name: latest frappe-nix release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the newest frappe-nix release the profile allows
        id: release
        run: |
          set -euo pipefail
          # The majors below requires-frappe-nix's upper bound, e.g. ">=1.1,<3" allows v1 and v2.
          max="$(sed -nE 's/^requires-frappe-nix = ".*<([0-9]+)".*/\1/p' profile.toml)"
          tag="$(git ls-remote --tags --refs https://github.com/Avunu/frappe-nix 'refs/tags/v*' |
            sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            awk -F'[v.]' -v max="${max:-0}" '$2 < max' | sort -V | tail -n 1 || true)"
          if [ -z "$tag" ]; then
            echo "::notice::no frappe-nix release falls in requires-frappe-nix; the pinned build is checked by the validate job"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: steps.release.outputs.tag != ''
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: steps.release.outputs.tag != ''
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      - name: Check the profile against ${{ steps.release.outputs.tag }}
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ref="github:Avunu/frappe-nix/$TAG"
          nix build "$ref#frappe-nix" --out-link "$RUNNER_TEMP/frappe-nix"
          src="$(nix flake prefetch --json "$ref" | jq -r .storePath)"
          FRAPPE_NIX="$RUNNER_TEMP/frappe-nix/bin/frappe-nix" FRAPPE_NIX_SRC="$src" scripts/check.sh --additive
