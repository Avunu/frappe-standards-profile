# Dependabot moves the two pins this repository has: the frappe-nix the validate workflow
# runs (flake.lock) and the actions' SHAs. Both land through a PR that the validate check
# gates; a frappe-nix bump that changes a resolved value fails until resolved.snapshot.json
# is updated on purpose.
#
# .github/workflows/dependabot-auto-merge.yml gives every one of these PRs auto-merge, so it
# merges once `validate` passes, and keeps them up to date with main.
version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    # The cooldown proposes the newest release that is already 7 days old, and does not
    # compare it with the pin. Pinning flake.nix to a fresh frappe-nix therefore got a PR
    # (#19) that moved it back from v2.1.0 to v1.4.0, the newest tag older than a week. The
    # frappe-nix pin is our own toolkit, checked by `latest`, so it takes no cooldown.
    cooldown:
      default-days: 7
      exclude: [frappe-nix]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
